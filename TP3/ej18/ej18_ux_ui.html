<!DOCTYPE html>
<html lang="es">
<head>

  <title>Ejercicio 18 - Galería mosaico</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Cada .item es una "imagen". Las clases extra (grande, ancho, alto) les dan tamaños distintos -->
  <div class="galeria">
    <div class="item grande">1</div>
    <div class="item">2</div>
    <div class="item alto">3</div>
    <div class="item">4</div>
    <div class="item ancho">5</div>
    <div class="item">6</div>
    <div class="item">7</div>
    <div class="item alto">8</div>
    <div class="item ancho">9</div>
    <div class="item">10</div>
    <div class="item">11</div>
    <div class="item">12</div>
    <div class="item">13</div>
    <div class="item">14</div>
  </div>
</body>
</html>
